<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="An end-to-end SOC 2 on AWS learning project: 36 controls, beginner definitions, service scope, executable tests, evidence, remediation and examination support.">
  <meta name="theme-color" content="#0b1220">
  <title>SOC 2 on AWS · Steven Smith</title>
  <link rel="stylesheet" href="web/experience.css">
  <style>body{margin:0;background:#0b1220;color:#eef3fc}.site-header{max-width:1280px;margin:auto;padding:24px clamp(18px,4vw,40px);display:flex;justify-content:space-between;gap:20px;font:13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.site-header a{color:#8bc9ff;text-decoration:none}.site-main{padding:8px clamp(18px,4vw,40px) 50px;max-width:1360px;margin:auto}.loading{padding:30px;font:16px sans-serif}</style>
</head>
<body>
  <header class="site-header"><span>Steven Smith <span style="color:#91a5c3">/ Assurance engineering</span></span><a href="https://www.brightridgellc.com/steven-smith-itnet/projects">Portfolio ↗</a></header>
  <main class="site-main"><div id="soc2-root" aria-busy="true"><p class="loading">Loading the SOC 2 learning project…</p></div></main>
  <noscript><p class="loading">Enable JavaScript for the interactive project, or read the <a href="https://github.com/steven-smith-itnet/soc2-cloud-control-mapping-demo/blob/main/README.md">repository guides</a>.</p></noscript>
  <script type="module">
    import { mountProgram } from './web/experience.js'
    const root=document.querySelector('#soc2-root')
    try {
      const paths=['data/program.json','evidence/examples/baseline/results.json']
      const values=await Promise.all(paths.map(async path=>{const response=await fetch(path);if(!response.ok)throw new Error('Unable to load '+path);return response.json()}))
      mountProgram(root,...values)
    } catch(error) {
      root.replaceChildren();const p=document.createElement('p');p.className='loading';p.textContent='Project content could not be loaded. Serve this folder over HTTP and reload. '+error.message;root.append(p)
    } finally { root.removeAttribute('aria-busy') }
  </script>
</body>
</html>
